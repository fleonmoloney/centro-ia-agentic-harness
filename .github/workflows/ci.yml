name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        run: pytest
      - name: Evals (modo scripted)
        run: python -m centro_harness.evals --cases evals/cases.jsonl --out-md reports/latest.md --out-json reports/latest.json
      - name: Subir reporte de evals
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: reports/
